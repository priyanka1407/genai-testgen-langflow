[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-testgen"
version = "1.0.0"
description = "GenAI-driven test case and synthetic test data generation (Langflow + Claude)"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7", "anthropic", "requests"]

[project.optional-dependencies]
docs = ["python-docx", "pypdf"]
gemini = ["google-genai>=1.75"]
langflow = ["langflow"]
dev = ["pytest"]

[project.scripts]
testgen = "testgen.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
